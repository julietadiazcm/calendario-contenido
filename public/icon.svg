<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#f0f0ff" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle noise texture overlay -->
  <rect width="512" height="512" rx="112" fill="white" opacity="0.04"/>

  <!-- Calendar card -->
  <rect x="80" y="128" width="352" height="296" rx="28" fill="url(#card)"/>

  <!-- Calendar header bar -->
  <rect x="80" y="128" width="352" height="86" rx="28" fill="#4f46e5"/>
  <rect x="80" y="182" width="352" height="32" fill="#4f46e5"/>

  <!-- Binding rings -->
  <rect x="166" y="98" width="26" height="62" rx="13" fill="white" opacity="0.9"/>
  <rect x="320" y="98" width="26" height="62" rx="13" fill="white" opacity="0.9"/>

  <!-- Month label placeholder lines -->
  <rect x="118" y="152" width="90" height="12" rx="6" fill="white" opacity="0.9"/>
  <rect x="118" y="170" width="56" height="8" rx="4" fill="white" opacity="0.5"/>

  <!-- Day-of-week header dots (7 columns) -->
  <circle cx="122" cy="252" r="8" fill="#c4b5fd" opacity="0.7"/>
  <circle cx="172" cy="252" r="8" fill="#c4b5fd" opacity="0.7"/>
  <circle cx="222" cy="252" r="8" fill="#c4b5fd" opacity="0.7"/>
  <circle cx="272" cy="252" r="8" fill="#c4b5fd" opacity="0.7"/>
  <circle cx="322" cy="252" r="8" fill="#c4b5fd" opacity="0.7"/>
  <circle cx="372" cy="252" r="8" fill="#c4b5fd" opacity="0.7"/>
  <circle cx="422" cy="252" r="8" fill="#c4b5fd" opacity="0.3"/>

  <!-- Week 1 -->
  <circle cx="272" cy="296" r="10" fill="#e0e7ff"/>
  <circle cx="322" cy="296" r="10" fill="#e0e7ff"/>
  <circle cx="372" cy="296" r="10" fill="#4f46e5"/>
  <circle cx="422" cy="296" r="10" fill="#e0e7ff" opacity="0.5"/>

  <!-- Week 2 -->
  <circle cx="122" cy="336" r="10" fill="#e0e7ff"/>
  <circle cx="172" cy="336" r="10" fill="#7c3aed"/>
  <circle cx="222" cy="336" r="10" fill="#e0e7ff"/>
  <circle cx="272" cy="336" r="10" fill="#e0e7ff"/>
  <circle cx="322" cy="336" r="10" fill="#4f46e5"/>
  <circle cx="372" cy="336" r="10" fill="#e0e7ff"/>
  <circle cx="422" cy="336" r="10" fill="#e0e7ff" opacity="0.5"/>

  <!-- Week 3 -->
  <circle cx="122" cy="376" r="10" fill="#e0e7ff"/>
  <circle cx="172" cy="376" r="10" fill="#e0e7ff"/>
  <circle cx="222" cy="376" r="10" fill="#7c3aed"/>
  <circle cx="272" cy="376" r="10" fill="#e0e7ff"/>
  <circle cx="322" cy="376" r="10" fill="#e0e7ff"/>

  <!-- Today highlight ring on one of the active dots -->
  <circle cx="372" cy="296" r="14" fill="none" stroke="#4f46e5" stroke-width="3" opacity="0.5"/>
</svg>
